<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#070708">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>MORE. Board</title>
<meta name="description" content="Private MORE. board.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/dashboard/app.css">
</head>
<body>
<div id="lock">
  <div class="lock-card">
    <svg class="lock-ring" viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="50" r="36" class="ring-track"></circle>
      <circle cx="50" cy="50" r="36" class="ring-hot"></circle>
      <circle cx="50" cy="50" r="28" class="ring-cyan"></circle>
    </svg>
    <p class="brand">MORE<i>.</i></p>
    <div id="lock-wait">
      <span class="pulse" aria-hidden="true"></span>
      <p>Arming</p>
    </div>
    <form id="lock-form" hidden>
      <h1>Pipeline</h1>
      <p class="lock-lead">Private board</p>
      <label for="pass">Passphrase</label>
      <div class="pass-row">
        <input id="pass" name="k" type="password" autocomplete="current-password" autocapitalize="characters" enterkeyhint="go" spellcheck="false" required>
        <button type="button" id="toggle-secret" class="ghost">Show</button>
      </div>
      <p id="lock-err" class="err" role="alert" hidden></p>
      <button type="submit" class="go" id="lock-go">Open</button>
    </form>
  </div>
</div>

<div id="app" hidden>
  <header class="top">
    <p class="brand">MORE<i>.</i></p>
    <p class="asof" id="asof"></p>
    <button type="button" id="logout">Lock</button>
  </header>
  <section class="cluster" id="dials" aria-label="Scoreboard"></section>
  <section class="chips" id="chips" aria-label="High and Medium leads"></section>
  <section class="next" aria-labelledby="next-title">
    <div class="sec">
      <h2 id="next-title">Do this next</h2>
      <button type="button" id="clear-done" hidden>Reset</button>
    </div>
    <ol id="queue"></ol>
  </section>
  <section class="hunt-sec" aria-labelledby="hunt-title">
    <h2 id="hunt-title">Where to hunt</h2>
    <div id="hunt"></div>
  </section>
</div>
<noscript><p class="noscript">This board needs JavaScript.</p></noscript>
<script src="/dashboard/model.js"></script>
<script src="/dashboard/app.js"></script>
</body>
</html>
