<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#070708">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>MORE. Board</title>
<meta name="dashboard-release" content="daily-workflow-2026-10-29">
<meta name="description" content="Private MORE. board.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/dashboard/vendor/leaflet.css">
<link rel="stylesheet" href="/dashboard/app.css">
</head>
<body>
<div id="lock">
  <div class="lock-card">
    <p class="brand">MORE<i>.</i></p>
    <div id="lock-wait"><span class="pulse" aria-hidden="true"></span><p>Arming</p></div>
    <form id="lock-form" hidden>
      <h1>Pipeline</h1>
      <p class="lock-lead">Private board</p>
      <label for="pass">Passphrase</label>
      <div class="pass-row">
        <input id="pass" name="k" type="password" autocomplete="current-password" autocapitalize="characters" enterkeyhint="go" spellcheck="false" required>
        <button type="button" id="toggle-secret" class="ghost">Show</button>
      </div>
      <p id="lock-err" class="err" role="alert" hidden></p>
      <button type="submit" class="go" id="lock-go">Open</button>
    </form>
  </div>
</div>

<div id="app" hidden>
  <header class="top">
    <p class="brand">MORE<i>.</i></p>
    <button type="button" id="logout" aria-label="Lock">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      Lock
    </button>
  </header>
  <section id="daily-goal" aria-label="Revenue goal and departure target"></section>
  <section class="cluster" id="dials" aria-label="Scoreboard"></section>
  <section id="high-block"></section>
  <section id="med-block"></section>
  <section class="board-actions" aria-label="Board views">
    <button type="button" id="open-pipeline" class="act">Pipeline</button>
    <button type="button" id="open-map" class="act map">Map</button>
    <button type="button" id="open-categories" class="act categories">Categories</button>
  </section>
  <section id="cold-block"></section>
  <section id="hunt-block"></section>
  <p id="source-note" class="source-note"></p>

  <div id="sheet-pipe" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="pipe-title">
    <header class="sheet-bar">
      <button type="button" class="sheet-x" data-close="pipe">Close</button>
      <h2 id="pipe-title">Pipeline</h2>
      <span id="pipe-count" class="sheet-meta"></span>
    </header>
    <div id="sortbar" class="sortbar" role="group" aria-label="Sort the pipeline"></div>
    <div id="pipe-list" class="sheet-scroll"></div>
  </div>

  <div id="sheet-map" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="map-title">
    <header class="sheet-bar">
      <button type="button" class="sheet-x" data-close="map">Close</button>
      <h2 id="map-title">Map</h2>
      <span class="sheet-meta">Hamptons</span>
    </header>
    <p id="map-coverage" class="coverage"></p>
    <div id="cluster-row" class="cluster-row"></div>
    <div id="map"></div>
    <p id="map-fallback" class="map-fallback" hidden>Map tiles did not load. The clusters below still open Google Maps.</p>
    <p id="unpinned" class="unpinned" hidden></p>
    <div id="visit-panel" class="visit-panel" hidden></div>
  </div>

  <div id="sheet-lead" class="sheet sheet-lead" hidden role="dialog" aria-modal="true" aria-labelledby="lead-title">
    <header class="sheet-bar">
      <button type="button" class="sheet-x" data-close="lead">Close</button>
      <h2 id="lead-title">Lead</h2>
      <span id="lead-pri" class="sheet-meta"></span>
    </header>
    <div id="lead-body" class="sheet-scroll"></div>
  </div>
</div>
<noscript><p class="noscript">This board needs JavaScript.</p></noscript>
<script src="/dashboard/vendor/leaflet.js"></script>
<script src="/dashboard/daily-model.js"></script>
<script src="/dashboard/model.js"></script>
<script src="/dashboard/daily.js"></script>
<script src="/dashboard/app.js"></script>
</body>
</html>
