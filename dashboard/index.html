<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#070708">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>MORE. Board</title>
<meta name="description" content="Private MORE. board.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/dashboard/app.css">
</head>
<body>
<div id="lock">
  <div class="lock-card">
    <p class="brand">MORE<i>.</i></p>
    <div id="lock-wait"><span class="pulse" aria-hidden="true"></span><p>Arming</p></div>
    <form id="lock-form" hidden>
      <h1>Pipeline</h1>
      <p class="lock-lead">Private board</p>
      <label for="pass">Passphrase</label>
      <div class="pass-row">
        <input id="pass" name="k" type="password" autocomplete="current-password" autocapitalize="characters" enterkeyhint="go" spellcheck="false" required>
        <button type="button" id="toggle-secret" class="ghost">Show</button>
      </div>
      <p id="lock-err" class="err" role="alert" hidden></p>
      <button type="submit" class="go" id="lock-go">Open</button>
    </form>
  </div>
</div>

<div id="app" hidden>
  <header class="top">
    <p class="brand">MORE<i>.</i></p>
    <button type="button" id="logout" aria-label="Lock">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      Lock
    </button>
  </header>
  <section class="cluster" id="dials" aria-label="Scoreboard"></section>
  <section id="high-block"></section>
  <section id="med-block"></section>
  <section id="next-block"></section>
  <section id="hunt-block"></section>
</div>
<noscript><p class="noscript">This board needs JavaScript.</p></noscript>
<script src="/dashboard/model.js"></script>
<script src="/dashboard/app.js"></script>
</body>
</html>
